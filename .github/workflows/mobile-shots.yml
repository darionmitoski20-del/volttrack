name: Mobile screenshots
on:
  workflow_dispatch:
  push:
    branches: ['shots/**']
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: node scripts/mobile-shots.mjs
        env:
          BASE: ${{ vars.SHOTS_BASE || 'https://darionmitoski20-del.github.io/volttrack' }}
      - name: Push screenshots to the shots-out branch
        if: always()
        run: |
          cd shots
          git init -q -b shots-out
          git config user.name "shots-bot"
          git config user.email "shots-bot@users.noreply.github.com"
          git add -A
          git commit -qm "screenshots ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" shots-out
