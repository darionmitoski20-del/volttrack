name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npx vite build
        env:
          VITE_BASE_PATH: /volttrack/
          VITE_APP_URL: https://darionmitoski20-del.github.io/volttrack
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      # GitHub Pages has no rewrites, so serve the app for every unknown path.
      - run: cp dist/index.html dist/404.html

      # Known pages also get their own copy, so links to them answer "200 OK"
      # (link previews and chat apps show "404" for the 404.html fallback).
      - name: Static copies for app routes
        run: |
          for r in signin create-company reset-password accept-invitation \
                   app app/employees app/job-sites app/time-entries app/timesheets app/materials \
                   app/reports app/live-hours app/analysis app/chat app/settings app/profile \
                   me me/time-entries me/timesheets me/calendar me/job-sites me/chat me/materials \
                   me/stats me/profile; do
            mkdir -p "dist/$r" && cp dist/index.html "dist/$r/index.html"
            cp dist/index.html "dist/$r.html"   # "/app" answers 200 directly, without a redirect to "/app/"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
